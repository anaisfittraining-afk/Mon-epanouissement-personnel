    { id: 'moral', label: '😊 Moral' }
  ];
  var BILAN_DRAFT = null; // scores/comments édités dans l'onglet, avant génération

  function last7Dates() {
    var out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(); d.setDate(d.getDate() - i);
      out.push(d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()));
    }
    return out;
  }
  function autoSuggestScores() {
    var dailyAll = getJourDailyAll();
    var week = getJourWeekly(currentWeekKey());
    // La semaine de la cliente (pas une fenêtre glissante générique), et seulement les jours déjà
    // écoulés — sinon les jours futurs, forcément à 0, tireraient la moyenne vers le bas à tort.
    var dates = currentWeekDatesElapsed();
    var sportCount = week.sport.filter(Boolean).length;
    var sportIdx = Math.min(sportCount, 3); // au-delà de l'objectif de 3, on plafonne au score max
    var sportScore = [2, 4, 7, 10][sportIdx];
    var coherenceRates = [], waterRatios = [], moods = [];
    dates.forEach(function(d) {
      var day = dailyAll[d];
      // Un jour sans aucune donnée est un jour où rien n'a été fait : on le compte comme 0/0,
      // pas comme "ignoré" — sinon la moyenne de la semaine peut être faussement gonflée à 10
      // par une seule bonne journée (par ex. en tout début de semaine).
      var cohDone = day ? (day.coherence||[]).filter(Boolean).length : 0;
      coherenceRates.push(cohDone / 3);
      var glasses = day ? (day.waterGlasses != null ? day.waterGlasses : (day.hydration ? WATER_TARGET_GLASSES : 0)) : 0;
      waterRatios.push(Math.min(glasses / WATER_TARGET_GLASSES, 1));
      if (day && day.mood != null) moods.push(day.mood);
    });
    var cardioScore = Math.round(1 + (coherenceRates.reduce(function(a,b){return a+b;},0) / coherenceRates.length) * 9);
    var hydratationScore = Math.round(1 + (waterRatios.reduce(function(a,b){return a+b;},0) / waterRatios.length) * 9);
    var moralScore = moods.length ? Math.round(moods.reduce(function(a,b){return a+b;},0) / moods.length) : 5;
    return { sport: sportScore, cardio: cardioScore, sommeil: 5, hydratation: hydratationScore, motivation: 5, suivi_plan: 5, moral: moralScore };
  }
  function autoSuggestDevperso() {
    var vision = getVision();
    var ic = getInnerChild();
    var parts = [];
    var doneActions = vision.actions.filter(function(a){ return a.done; }).slice(-2);
    if (doneActions.length) parts.push('Vision : ' + doneActions.map(function(a){ return a.text; }).join(', '));
    var lastJournal = ic.dailyLog.filter(function(x){ return x.type === 'journal'; })[0];
    if (lastJournal && lastJournal.accomplishment) parts.push('Reparentage : ' + lastJournal.accomplishment);
    return parts.join(' — ');
  }
  function autoSuggestMantra() {
    var d = getJourDaily(todayISO());
    return d.mantra || '';
  }
  function autoSuggestCycle() {
    var info = computeCycleInfo();
    if (!info) return { cycle: '', cycleJ: '' };
    var c = getCycle();
    var cycle = 'non';
    if (info.phaseId === 'menstruelle') cycle = 'oui';
    else if (info.phaseId === 'luteale' && (c.cycleLength - info.cycleDay) <= 4) cycle = 'pms';
    return { cycle: cycle, cycleJ: String(info.cycleDay) };
  }

  function bilanInitDraft() {
    if (BILAN_DRAFT) return;
    var auto = autoSuggestScores();
    var cyc = autoSuggestCycle();
    BILAN_DRAFT = {
      scores: auto,
      comments: { sport: '', cardio: '', sommeil: '', hydratation: '', motivation: '', moral: '' },
      mantra: autoSuggestMantra(),
      priosem1: '', priosem2: '', priosem3: '',
      blocage: '', devperso: autoSuggestDevperso(), smiles: '', pasmoyen: '',
      cycle: cyc.cycle, cycleJ: cyc.cycleJ
    };
  }
  function bilanSetScore(pillarId, val) {
    bilanInitDraft();
    BILAN_DRAFT.scores[pillarId] = parseInt(val, 10);
    var numEl = document.getElementById('bilan-score-num-' + pillarId);
    if (numEl) numEl.textContent = val;
    if (pillarId === 'motivation' || pillarId === 'suivi_plan') bilanRenderDiscipline();
  }

  // ===== DISCIPLINE (calculée à partir des scores motivation + suivi du plan) =====
  function bilanComputeDiscipline() {
    var mot = (BILAN_DRAFT && BILAN_DRAFT.scores.motivation != null) ? parseInt(BILAN_DRAFT.scores.motivation, 10) : 5;
    var sp = (BILAN_DRAFT && BILAN_DRAFT.scores.suivi_plan != null) ? parseInt(BILAN_DRAFT.scores.suivi_plan, 10) : 5;
    var disc = Math.min(10, Math.round((sp + Math.max(0, sp - mot) / 2) * 10) / 10);
    var msg;
    if (mot <= 4 && sp >= 7) msg = '🏆 La discipline prend le relais ! Tu avances sans motivation — c\'est ta vraie force.';
    else if (mot <= 4 && sp >= 5) msg = '💜 Tu continues malgré le manque d\'envie. C\'est exactement comme ça que la discipline se construit.';
    else if (mot <= 6 && sp > mot) msg = '💪 Ton suivi dépasse ta motivation — c\'est ça la discipline ! Tu n\'attends pas l\'envie pour agir.';
    else if (mot >= 8 && sp >= 8) msg = '🔥 Motivation ET discipline au maximum ! Continue sur cette lancée.';
    else if (mot >= 7 && sp >= 6) msg = '✨ Belle semaine ! Quand la motivation sera plus basse, ton suivi du plan fera la différence.';
    else msg = '🎯 Chaque action compte, quelle que soit l\'envie. La régularité construit la discipline.';
    return { disc: disc, msg: msg, mot: mot, sp: sp };
  }
  function bilanRenderDiscipline() {
    var d = bilanComputeDiscipline();
    var scoreEl = document.getElementById('bilan-disc-score');
    var barEl = document.getElementById('bilan-disc-bar');
    var msgEl = document.getElementById('bilan-disc-msg');
    if (scoreEl) scoreEl.textContent = (d.disc % 1 === 0 ? d.disc : d.disc.toFixed(1)) + '/10';
    if (barEl) barEl.style.width = (d.disc / 10 * 100) + '%';
    if (msgEl) msgEl.textContent = d.msg;
  }

  var _mensCharts = {};
  function getMensurations() { return getJSON(MENSURATIONS_KEY, []); }

  function mensSaveEntry() {
    var btn = document.getElementById('mensSaveBtn');
    var rawDate = (document.getElementById('bilan-mens-date') || {}).value;
    var date;
    if (rawDate && /^\d{4}-\d{2}-\d{2}$/.test(rawDate)) {
      var dp = rawDate.split('-');
      date = dp[2] + '/' + dp[1] + '/' + dp[0];
    } else {
      date = formatDDMMYYYY(todayISO());
    }
    var entry = { date: date };
    var hasValue = false;
    MENS_FIELDS.forEach(function(f) {
      var el = document.getElementById('bilan-' + f.id);
      if (el && el.value !== '') { entry[f.id] = parseFloat(el.value); hasValue = true; }
    });
    if (!hasValue) { alert('Remplis au moins une mensuration avant d\'enregistrer !'); return; }
    var all = getMensurations();
    var idx = -1;
    for (var k = 0; k < all.length; k++) { if (all[k].date === date) { idx = k; break; } }
    if (idx >= 0) all[idx] = entry; else all.unshift(entry);
    saveMensurationsAll(all);
    if (btn) { btn.textContent = '✅ Enregistré !'; setTimeout(function() { btn.textContent = '💾 Enregistrer mes mensurations'; }, 2000); }
    bilanRenderMensHistory();
  }
  function mensDeleteEntry(idx) {
    var all = getMensurations();
    all.splice(idx, 1);
    saveMensurationsAll(all);
    bilanRenderMensHistory();
  }
  function bilanRenderMensHistory() {
    var all = getMensurations();
    var histDiv = document.getElementById('bilanMensHistory');
    if (!histDiv) return;
    if (!all.length) { histDiv.style.display = 'none'; return; }
    histDiv.style.display = 'block';
    var table = document.getElementById('bilanMensTable');
    var visibleFields = MENS_FIELDS.filter(function(fld) { return all.some(function(e) { return e[fld.id] !== undefined; }); });
    var html = '<thead><tr><th>Date</th>';
    visibleFields.forEach(function(f) { html += '<th>' + f.label + '</th>'; });
    html += '<th></th></tr></thead><tbody>';
    all.forEach(function(entry, ei) {
      var prev = all[ei + 1];
      html += '<tr><td><b>' + (entry.date || '—') + '</b></td>';
      visibleFields.forEach(function(fld) {
        var v = entry[fld.id];
        if (v === undefined) { html += '<td>—</td>'; return; }
        var diffStr = '';
        if (prev && prev[fld.id] !== undefined) {
          var dv = parseFloat((v - prev[fld.id]).toFixed(1));
          if (dv !== 0) {
            var cls = (fld.id === 'm-poids') ? (dv > 0 ? 'diff-neg' : 'diff-pos') : (dv < 0 ? 'diff-pos' : 'diff-neg');
            diffStr = ' <span class="' + cls + '">(' + (dv > 0 ? '+' : '') + dv + ')</span>';
          }
        }
        html += '<td>' + v + (fld.unit === 'kg' ? 'kg' : '') + diffStr + '</td>';
      });
      html += '<td><button type="button" class="mens-delete-btn" onclick="mensDeleteEntry(' + ei + ')" title="Supprimer">🗑</button></td></tr>';
    });
    html += '</tbody>';
    table.innerHTML = html;
    var chartsEl = document.getElementById('bilanMensCharts');
    if (chartsEl && chartsEl.style.display !== 'none') bilanRenderMensCharts();
  }
  function bilanToggleMensCharts() {
    var el = document.getElementById('bilanMensCharts');

  function bilanRenderMensCharts() {
    var all = getMensurations().slice().reverse();
    if (!all.length || typeof Chart === 'undefined') return;
    var labels = all.map(function(e) { return e.date; });
    function mapField(field) { return all.map(function(e) { return e[field] != null ? e[field] : null; }); }
    function mkChart(canvasId, datasets) {
      if (_mensCharts[canvasId]) _mensCharts[canvasId].destroy();
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      _mensCharts[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } } },
          scales: { x: { ticks: { font: { size: 10 }, maxRotation: 45 } }, y: { ticks: { font: { size: 10 } } } },
          elements: { point: { radius: 4 }, line: { tension: 0.3 } }
        }
      });
    }
    var colors = ['#3F5D46', '#A8863A', '#6F8F6C', '#B96A46', '#D97A52'];
    mkChart('bilanChartPoids', [{ label: 'Poids (kg)', borderColor: '#3F5D46', backgroundColor: '#3F5D4622', data: mapField('m-poids'), fill: true }]);
    mkChart('bilanChartTours', [
      { label: 'Poitrine', borderColor: colors[0], backgroundColor: 'transparent', data: mapField('m-poitrine') },
      { label: 'Taille nombril', borderColor: colors[1], backgroundColor: 'transparent', data: mapField('m-taille-nombril') },
      { label: 'Taille bas ventre', borderColor: colors[2], backgroundColor: 'transparent', data: mapField('m-taille-bas') },
      { label: 'Hanches', borderColor: colors[3], backgroundColor: 'transparent', data: mapField('m-hanches') }
    ]);
    mkChart('bilanChartMembres', [
      { label: 'Cuisse haute G', borderColor: colors[0], backgroundColor: 'transparent', borderDash: [4, 2], data: mapField('m-cuisse-haute-g') },
      { label: 'Cuisse haute D', borderColor: colors[0], backgroundColor: 'transparent', data: mapField('m-cuisse-haute-d') },
      { label: 'Bras G', borderColor: colors[3], backgroundColor: 'transparent', borderDash: [4, 2], data: mapField('m-bras-g') },
      { label: 'Bras D', borderColor: colors[3], backgroundColor: 'transparent', data: mapField('m-bras-d') }
    ]);
  }

  function bilanSyncFromDom() {
    if (!BILAN_DRAFT) return;
    BILAN_PILLARS.forEach(function(p) {

      if (c) BILAN_DRAFT.comments[p.id] = c.value;

  function cleanEmpty(obj) {
    var out = {};
    Object.keys(obj).forEach(function(k) {
      var val = obj[k];
      if (val == null || val === '' || val === 0) return;
      if (typeof val === 'object' && !Array.isArray(val)) {
        var inner = cleanEmpty(val);
        if (Object.keys(inner).length) out[k] = inner;
      } else out[k] = val;
    });
    return out;
  }

  function bilanWeekVacuumSummary() {
    var dailyAll = getJourDailyAll();
    var dates = currentWeekDatesElapsed();
    var totalSeries = 0, joursActifs = 0;
    dates.forEach(function(d) {
      var day = dailyAll[d];
      var v = day ? (day.vacuum || 0) : 0;
      if (v > 0) { totalSeries += v; joursActifs++; }
    });
    if (!totalSeries) return null;
    return { series: totalSeries, jours: joursActifs };
  }

  function bilanBuildPayload() {
    bilanSyncFromDom();
    var identity = getIdentity();
    var alim = getAlimentation();
    var weekMeals = {};
    Object.keys(alim.weekMeals).forEach(function(j) {
      weekMeals[j] = {};
      Object.keys(alim.weekMeals[j]).forEach(function(m) {
        var cell = alim.weekMeals[j][m];
        if (cell && (cell.t || cell.ty)) weekMeals[j][m] = { t: (cell.t||'').slice(0,80), ty: cell.ty||'' };
      });
    });
    var disc = bilanComputeDiscipline();
    var scores = Object.assign({ alimentation: alim.score }, BILAN_DRAFT.scores);
    scores.discipline = disc.disc;
    var mensAll = getMensurations();
    var data = {
      nom: (identity.prenom + ' ' + identity.nom).trim(),
      email: identity.email,
      date: formatDDMMYYYY(todayISO()),
      cycle: BILAN_DRAFT.cycle, cycleJ: BILAN_DRAFT.cycleJ,
      mantra: BILAN_DRAFT.mantra,
      priosem1: BILAN_DRAFT.priosem1, priosem2: BILAN_DRAFT.priosem2, priosem3: BILAN_DRAFT.priosem3,
      blocage: BILAN_DRAFT.blocage, devperso: BILAN_DRAFT.devperso, smiles: BILAN_DRAFT.smiles, pasmoyen: BILAN_DRAFT.pasmoyen,
      scores: scores,
      comments: Object.assign({ alimentation: alim.comment }, BILAN_DRAFT.comments),
      weekMeals: weekMeals,
      vacuum: bilanWeekVacuumSummary(),
      mensurations: mensAll.length ? mensAll[0] : null
    };
    // Sections personnelles à part : jamais incluses, sauf si la cliente a explicitement
    // activé le partage de cette section (voir sharePrefsToggleHtml / getSharePrefs).
    var prefs = getSharePrefs();
    if (prefs.vision) data.vision = getVision();
    if (prefs.enfant) data.enfant = getInnerChild();
    if (prefs.objectifs) data.objectifs = getObjectifsList();
    if (prefs.reves) data.reves = getGrandsReves();
    if (prefs.ecriture) { data.ecriture = getEcriture(); data.nightDreams = getNightDreams(); }
    return cleanEmpty(data);
  }

    setJSON(BILAN_HISTORY_KEY, all);
  }
  function deleteBilanHistoryEntry(idx) {
    var all = getBilanHistory();
    all.splice(idx, 1);
    setJSON(BILAN_HISTORY_KEY, all);
    renderBilanHistoryList();
  }
  var BILAN_HISTORY_OPEN_IDX = null;
  function bilanToggleHistoryEntry(idx) {
    BILAN_HISTORY_OPEN_IDX = (BILAN_HISTORY_OPEN_IDX === idx) ? null : idx;
    renderBilanHistoryList();
  }
  function renderBilanHistoryList() {
    var el = document.getElementById('bilanHistoryList');
    if (!el) return;
    var all = getBilanHistory();
    if (!all.length) {
      el.innerHTML = '<p class="points-note" style="margin-top:0;">Aucun bilan envoyé pour l\'instant — ton historique apparaîtra ici dès que tu en généreras un.</p>';
      return;
    }
    var out = '';
    all.forEach(function(entry, idx) {
      var open = BILAN_HISTORY_OPEN_IDX === idx;
      out += '<div class="access-row" style="flex-direction:column;align-items:stretch;">';
      out += '<div style="display:flex;align-items:center;gap:10px;">';
      out += '<div class="access-info" style="cursor:pointer;" onclick="bilanToggleHistoryEntry(' + idx + ')">';
      out += '<div class="access-name">' + esc(entry.date) + '</div>';
      if (entry.scores) {
        var bits = [];
        ['alimentation', 'sport', 'moral', 'discipline'].forEach(function(k) { if (entry.scores[k] != null) bits.push(k + ' ' + entry.scores[k] + '/10'); });
        if (bits.length) out += '<div class="access-seen">' + esc(bits.join(' · ')) + '</div>';
      }
      out += '</div>';
      out += '<button type="button" class="access-toggle-btn" onclick="bilanToggleHistoryEntry(' + idx + ')">' + (open ? '▲ Masquer' : '▼ Voir') + '</button>';
      out += '<button type="button" class="access-toggle-btn danger" onclick="deleteBilanHistoryEntry(' + idx + ')">🗑</button>';
      out += '</div>';
      if (open) out += '<textarea readonly rows="10" style="margin-top:10px;">' + esc(entry.text) + '</textarea>';
      out += '</div>';
    });
    el.innerHTML = out;
  }

  function bilanGenerate() {
    var identity = getIdentity();
    var errEl = document.getElementById('bilan-identity-error');
    if (!identity.prenom || !identity.email || identity.email.indexOf('@') < 0) {
      if (errEl) errEl.style.display = 'block';
      return;
    }
    if (errEl) errEl.style.display = 'none';
    var clean = bilanBuildPayload();
    var jsonStr = JSON.stringify(clean);
    var code;
    if (typeof LZString !== 'undefined') code = 'EPANOUISSEMENT:' + LZString.compressToBase64(jsonStr);
    else code = 'EPANOUISSEMENTB64:' + btoa(unescape(encodeURIComponent(jsonStr)));

    var text = '🌿 Bilan Épanouissement — ' + clean.date + '\n';
    text += '👤 ' + clean.nom + (clean.email ? ' (' + clean.email + ')' : '') + '\n\n';
    if (clean.scores) {
      text += '📊 Scores :\n';
      Object.keys(clean.scores).forEach(function(k) { text += '· ' + k + ' : ' + clean.scores[k] + '/10\n'; });
      text += '\n';
    }
    if (clean.mantra) text += '✨ Mantra : ' + clean.mantra + '\n';
    if (clean.priosem1 || clean.priosem2 || clean.priosem3) {
      text += '📅 Priorités de la semaine : ' + [clean.priosem1, clean.priosem2, clean.priosem3].filter(Boolean).join(' · ') + '\n';
    }
    if (clean.blocage) text += '🚧 Blocages : ' + clean.blocage + '\n';
    if (clean.devperso) text += '🌱 Développement perso : ' + clean.devperso + '\n';
    if (clean.smiles) text += '😊 Smiles : ' + clean.smiles + '\n';
    if (clean.vacuum && clean.vacuum.series) {
      text += '🌬️ Vacuum abdominal : ' + clean.vacuum.series + ' série' + (clean.vacuum.series > 1 ? 's' : '') + ' sur ' + (clean.vacuum.jours || 0) + ' jour' + (clean.vacuum.jours > 1 ? 's' : '') + ' cette semaine\n';
    }
    if (clean.mensurations) {
      text += '📏 Mensurations (' + clean.mensurations.date + ') :\n';
      MENS_FIELDS.forEach(function(f) {
        if (clean.mensurations[f.id] != null) text += '· ' + f.label + ' : ' + clean.mensurations[f.id] + f.unit + '\n';
      });
    }
    // Sections partagées volontairement (voir bilanBuildPayload / getSharePrefs) — résumé lisible pour le WhatsApp.
    if (clean.vision) {
      text += '\n🔭 Vision (partagée) :\n';
      if (clean.vision.statement) text += '· Ma vision : ' + clean.vision.statement + '\n';
      if (clean.vision.values && clean.vision.values.length) text += '· Valeurs : ' + clean.vision.values.join(', ') + '\n';
    }
    if (clean.enfant) {
      text += '\n🧒 Enfant intérieur (partagé) :\n';
      if (clean.enfant.letters && clean.enfant.letters.length) text += '· ' + clean.enfant.letters.length + ' lettre(s) écrite(s)\n';
      if (clean.enfant.beliefs && clean.enfant.beliefs.length) text += '· ' + clean.enfant.beliefs.length + ' croyance(s) notée(s)\n';
    }
    if (clean.objectifs && clean.objectifs.length) {
      text += '\n🎯 Objectifs (partagés) :\n';
      clean.objectifs.forEach(function(g) { if (g.final) text += '· ' + g.final + '\n'; });
    }
    if (clean.reves && clean.reves.length) {
      text += '\n🌙 Grands rêves de vie (partagés) :\n';
      clean.reves.forEach(function(r) { if (r.text) text += '· ' + r.text + '\n'; });
    }
    if (clean.ecriture && clean.ecriture.length) {
      text += '\n✍️ Écriture libre (partagée) : ' + clean.ecriture.length + ' texte(s)\n';
    }
    if (clean.nightDreams && clean.nightDreams.length) {
      text += '🌙 Rêves de la nuit (partagés) : ' + clean.nightDreams.length + ' rêve(s) noté(s)\n';
    }
    text += '\n📥 Code bilan :\n' + code;

    document.getElementById('bilanCodeBox').value = code;
    document.getElementById('bilanTextBox').value = text;
    document.getElementById('bilanOutput').style.display = 'block';

    saveBilanHistoryEntry({ date: clean.date, savedAt: new Date().toISOString(), text: text, scores: clean.scores || {} });
    renderBilanHistoryList();
  }
  function bilanSendEmail() {
    var text = document.getElementById('bilanTextBox').value;
    var subject = encodeURIComponent('Mon bilan Épanouissement');
    var body = encodeURIComponent(text);
    window.location.href = 'mailto:anaisfittraining@gmail.com?subject=' + subject + '&body=' + body;
  }
  function bilanShareCode() {
    var text = document.getElementById('bilanTextBox').value;
    if (navigator.share) { navigator.share({ title: 'Mon bilan Épanouissement', text: text }).catch(function(){}); }
    else bilanCopyText();
  }
  function bilanCopyText() {
    var area = document.getElementById('bilanTextBox');
    area.focus(); area.select();
    try { document.execCommand('copy'); var s = document.getElementById('bilanCopyStatus'); if (s) { s.textContent = '✅ Copié !'; setTimeout(function(){ s.textContent=''; }, 1800); } } catch (e) {}
  }

  function renderBilan() {
    var el = document.getElementById('view-bilan');
    if (!el) return;
    bilanInitDraft();
    var identity = getIdentity();
    var out = '';
    out += '<div class="section-head"><h2>📤 Mon bilan</h2></div>';
    out += '<p class="intro-text">Cette page rassemble automatiquement ce que tu as rempli dans les autres onglets (alimentation, cycle, mantra…). Vérifie, complète les derniers champs, puis envoie-le à ta coach — exactement comme avant.</p>';
    out += '<div class="disclaimer">📅 <b>Attention :</b> ce bilan est une évaluation hebdomadaire, à envoyer une fois par semaine. Pour suivre ton évolution au jour le jour, va voir l\'onglet ☀️ Aujourd\'hui.</div>';

    var settings = getSettings();
    var thisWeekDates = weekDatesForKey(currentWeekKey());
    out += '<div class="card"><h3>🗓️ Ma semaine</h3><p class="card-sub">Certaines semaines ne commencent pas le lundi (ex : du jeudi au jeudi) — choisis ton jour de départ pour que ce bilan et ton suivi de sport correspondent bien à ta vraie semaine.</p>';
    out += '<span class="field-label">Ma semaine commence le…</span><select onchange="settingsSetWeekStart(this.value)">';
    WEEK_START_OPTIONS.forEach(function(o) { out += '<option value="' + o[0] + '"' + (settings.weekStartDay === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; });
    out += '</select>';
    out += '<p class="points-note">Semaine en cours : du ' + formatDDMMYYYY(thisWeekDates[0]) + ' au ' + formatDDMMYYYY(thisWeekDates[6]) + '.</p>';
    out += '</div>';

    out += '<div class="card"><h3>👤 Mes infos</h3>';
    out += '<span class="field-label">Mon prénom</span><input type="text" id="bilan-prenom" value="' + esc(identity.prenom) + '" onblur="identitySave()">';
    out += '<span class="field-label">Mon nom</span><input type="text" id="bilan-nom" value="' + esc(identity.nom) + '" onblur="identitySave()">';
    out += '<span class="field-label">Mon e-mail</span><input type="email" id="bilan-email" value="' + esc(identity.email) + '" onblur="identitySave()">';
    out += '<div class="lock-error" id="bilan-identity-error" style="display:none;">Merci d\'indiquer ton prénom et un e-mail valide avant de générer ton bilan.</div>';
    out += '</div>';

    out += '<div class="card"><h3>🌸 Cycle</h3>';
    out += '<span class="field-label">Où en es-tu ?</span><select id="bilan-cycle-select">';
    [['', '—'], ['non', 'Pas de règles'], ['oui', 'J\'ai mes règles'], ['pms', 'SPM (avant règles)']].forEach(function(o) {
      out += '<option value="' + o[0] + '"' + (BILAN_DRAFT.cycle === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    });
    out += '</select>';
    out += '<span class="field-label">Jour de cycle</span><input type="number" id="bilan-cyclej" min="1" max="60" value="' + esc(BILAN_DRAFT.cycleJ) + '">';
    out += '<p class="points-note">Pré-rempli automatiquement depuis l\'onglet 🌸 Cycle.</p></div>';

    out += '<div class="card"><h3>🥗 Alimentation</h3><p class="card-sub">Rempli automatiquement depuis l\'onglet 🍽️ Alimentation (score : ' + getAlimentation().score + '/10).</p></div>';

    out += '<div class="card"><h3>📊 Ma semaine, en quelques scores</h3><p class="card-sub">Pré-remplis à partir de tes habitudes cochées dans l\'onglet ☀️ Jour — ajuste si besoin.</p>';
    BILAN_PILLARS.forEach(function(p) {
      var val = BILAN_DRAFT.scores[p.id];
      out += '<div class="score-row"><span class="score-label">' + p.label + '</span><span class="score-num" id="bilan-score-num-' + p.id + '">' + val + '</span></div>';
      out += '<input type="range" min="1" max="10" value="' + val + '" oninput="bilanSetScore(' + jsAttr(p.id) + ',this.value)">';
      out += '<input type="text" id="bilan-comment-' + p.id + '" placeholder="Un mot ? (optionnel)" style="margin-bottom:12px;" value="' + esc(BILAN_DRAFT.comments[p.id]||'') + '">';
    });
    out += '</div>';

    var disc = bilanComputeDiscipline();
    out += '<div class="card"><h3>🏆 Ma discipline</h3><p class="card-sub">Calculée automatiquement à partir de tes scores 🔥 Motivation et 📋 Suivi du plan ci-dessus.</p>';
    out += '<div class="disc-wrap"><div class="disc-score" id="bilan-disc-score">' + (disc.disc % 1 === 0 ? disc.disc : disc.disc.toFixed(1)) + '/10</div>';
    out += '<div class="disc-bar-wrap"><div class="disc-bar" id="bilan-disc-bar" style="width:' + (disc.disc / 10 * 100) + '%"></div></div>';
    out += '<div class="disc-msg" id="bilan-disc-msg">' + esc(disc.msg) + '</div></div></div>';

    out += '<div class="card"><h3>📏 Mes mensurations</h3><p class="card-sub">Prends tes mesures une fois par semaine, toujours dans les mêmes conditions, pour un suivi fiable.</p>';
    out += '<div class="mens-date-row"><label>📅 Date</label><input type="date" id="bilan-mens-date" value="' + todayISO() + '"></div>';
    out += '<div class="mens-grid"><div>';
    out += '<div class="mens-group-title">⚖️ Poids & buste</div>';
    out += '<div class="mens-row"><label>Poids</label><input type="number" id="bilan-m-poids" step="0.1" placeholder="0.0"><span class="mens-unit">kg</span></div>';
    out += '<div class="mens-row"><label>Poitrine</label><input type="number" id="bilan-m-poitrine" step="0.5" placeholder="0"><span class="mens-unit">cm</span></div>';
    out += '<div class="mens-row"><label>Taille nombril</label><input type="number" id="bilan-m-taille-nombril" step="0.5" placeholder="0"><span class="mens-unit">cm</span></div>';
    out += '<div class="mens-row"><label>Taille bas ventre</label><input type="number" id="bilan-m-taille-bas" step="0.5" placeholder="0"><span class="mens-unit">cm</span></div>';
    out += '<div class="mens-row"><label>Hanches</label><input type="number" id="bilan-m-hanches" step="0.5" placeholder="0"><span class="mens-unit">cm</span></div>';
    out += '</div><div>';
    out += '<div class="mens-group-title">💪 Membres (G / D)</div>';
    [['Cuisse haute', 'cuisse-haute'], ['Cuisse milieu', 'cuisse-milieu'], ['Cuisse basse', 'cuisse-basse'], ['Bras', 'bras']].forEach(function(pair) {
      out += '<div class="mens-row-pair"><label>' + pair[0] + '</label><div class="mens-pair">';
      out += '<span class="gl">G</span><input type="number" id="bilan-m-' + pair[1] + '-g" step="0.5" placeholder="0">';
      out += '<span class="gl">D</span><input type="number" id="bilan-m-' + pair[1] + '-d" step="0.5" placeholder="0">';
      out += '<span class="mens-unit">cm</span></div></div>';
    });
    out += '</div></div>';
    out += '<button type="button" class="mens-save-btn" id="mensSaveBtn" onclick="mensSaveEntry()">💾 Enregistrer mes mensurations</button>';
    out += '<div id="bilanMensHistory" style="display:none;">';
    out += '<p class="mens-history-title">📊 Mon historique d\'évolution</p>';
    out += '<div class="mens-table-wrap"><table class="mens-table" id="bilanMensTable"></table></div>';
    out += '<button type="button" class="mens-charts-toggle" id="bilanChartsToggleBtn" onclick="bilanToggleMensCharts()">📈 Afficher mes courbes d\'évolution</button>';
    out += '<div id="bilanMensCharts" style="display:none;">';
    out += '<div class="mens-chart-wrap"><h4>⚖️ Poids (kg)</h4><canvas id="bilanChartPoids" height="120"></canvas></div>';
    out += '<div class="mens-chart-wrap"><h4>📏 Tour de taille & hanches (cm)</h4><canvas id="bilanChartTours" height="120"></canvas></div>';
    out += '<div class="mens-chart-wrap"><h4>💪 Cuisses et bras (cm)</h4><canvas id="bilanChartMembres" height="120"></canvas></div>';
    out += '</div></div></div>';

    out += '<div class="card"><h3>📸 Photos de progression</h3><p class="card-sub">Prends 4 photos (face, dos, profil gauche, profil droit) et envoie-les directement à ta coach — elles ne sont jamais enregistrées dans l\'application.</p>';
    out += '<div class="prog-photo-grid">';
    [['face', '🤳', 'Face', 'user'], ['dos', '🔄', 'Dos', 'environment'], ['gauche', '👈', 'Profil gauche', ''], ['droit', '👉', 'Profil droit', '']].forEach(function(s) {
      var key = s[0], icon = s[1], label = s[2], capture = s[3];
      var inputId = 'bilan-prog-' + key, imgId = 'bilan-prev-' + key;
      out += '<div class="prog-photo-slot" onclick="progTrigger(' + jsAttr(inputId) + ')">';
      out += '<input type="file" id="' + inputId + '" accept="image/*"' + (capture ? ' capture="' + capture + '"' : '') + ' style="display:none" onchange="progLoadPhoto(event,' + jsAttr(inputId) + ',' + jsAttr(imgId) + ',' + jsAttr(key) + ')">';
      out += '<div class="prog-photo-preview"><img id="' + imgId + '" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:12px">';
      out += '<div id="bilan-ph-' + key + '" class="prog-photo-placeholder"><span style="font-size:22px;">' + icon + '</span><span style="font-size:11px;font-weight:600;color:var(--muted);">' + label + '</span></div></div>';
      out += '<button type="button" class="prog-del-btn" id="bilan-del-' + key + '" onclick="event.stopPropagation();progClearPhoto(' + jsAttr(inputId) + ',' + jsAttr(imgId) + ',' + jsAttr(key) + ')" style="display:none;">✕</button>';
      out += '</div>';
    });
    out += '</div>';
    out += '<button type="button" class="btn full" id="progPhotoShareBtn" onclick="progSharePhotos()" style="display:none;margin-top:10px;">📤 Envoyer mes photos de progression à ma coach</button>';
    out += '</div>';

    out += '<div class="card"><h3>✨ Le reste, en quelques mots</h3>';
    out += '<span class="field-label">Mantra du jour</span><input type="text" id="bilan-field-mantra" value="' + esc(BILAN_DRAFT.mantra) + '">';
    out += '<span class="field-label">Priorité 1 de la semaine</span><input type="text" id="bilan-field-priosem1" value="' + esc(BILAN_DRAFT.priosem1) + '">';
    out += '<span class="field-label">Priorité 2</span><input type="text" id="bilan-field-priosem2" value="' + esc(BILAN_DRAFT.priosem2) + '">';
    out += '<span class="field-label">Priorité 3</span><input type="text" id="bilan-field-priosem3" value="' + esc(BILAN_DRAFT.priosem3) + '">';
    out += '<span class="field-label">Points de blocage</span><textarea id="bilan-field-blocage" rows="2">' + esc(BILAN_DRAFT.blocage) + '</textarea>';
    out += '<span class="field-label">Développement personnel</span><textarea id="bilan-field-devperso" rows="2">' + esc(BILAN_DRAFT.devperso) + '</textarea>';
    out += '<p class="points-note" style="margin-top:-6px;">Pré-rempli à partir de tes onglets Vision et Enfant intérieur.</p>';
    out += '<span class="field-label">Les smiles de ma semaine</span><textarea id="bilan-field-smiles" rows="2">' + esc(BILAN_DRAFT.smiles) + '</textarea>';
    out += '<span class="field-label">Nombre de pas moyen / jour</span><input type="number" id="bilan-field-pasmoyen" value="' + esc(BILAN_DRAFT.pasmoyen) + '">';
    out += '</div>';

    out += '<div class="card"><h3>📮 Envoyer mon bilan</h3><p class="card-sub">Génère le bilan complet, à envoyer à ta coach — comme d\'habitude.</p>';
    out += '<button class="btn full" onclick="bilanGenerate()">✨ Générer mon bilan</button>';
    out += '<div id="bilanOutput" style="display:none;margin-top:14px;">';
    out += '<span class="field-label">Résumé</span><textarea id="bilanTextBox" rows="8" readonly></textarea>';
    out += '<textarea id="bilanCodeBox" style="display:none;"></textarea>';
    out += '<div class="btn-row">';
    out += '<button class="btn" onclick="bilanSendEmail()">📧 Envoyer par e-mail</button>';
    out += '<button class="btn secondary" onclick="bilanShareCode()">📱 Envoyer par WhatsApp</button>';
    out += '<button class="btn ghost" onclick="bilanCopyText()">📋 Copier</button>';
    out += '</div><span class="points-note" id="bilanCopyStatus"></span>';
    out += '</div></div>';

    out += '<div class="card"><h3>📜 Historique de mes bilans</h3><p class="card-sub">Retrouve tous les bilans que tu as déjà envoyés à ta coach.</p>';
    out += '<div id="bilanHistoryList"></div>';
    out += '</div>';

    el.innerHTML = out;
    bilanRenderMensHistory();
    renderBilanHistoryList();
  }

  window.addEventListener('load', function() {
    initAll();
    initSync();
  });
</script>
</body>
</html>
