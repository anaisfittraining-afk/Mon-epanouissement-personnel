  ];
  // Curseurs calculés automatiquement à partir de ce qui est noté pendant la semaine (la motivation,
  // elle, reste un ressenti personnel à régler à la main).
  var BILAN_AUTO_PILLARS = ['alimentation', 'sport', 'cardio', 'sommeil', 'hydratation', 'vacuum', 'suivi_plan', 'moral'];
  var BILAN_DRAFT = null; // brouillon de la semaine affichée (scores/commentaires/textes), avant génération
  var BILAN_DRAFT_WEEK = null; // clé de la semaine à laquelle appartient BILAN_DRAFT
  var BILAN_WEEK_OFFSET = 0; // 0 = semaine de référence, -1 = semaine d'avant (jamais mémorisé : on repart toujours sur la semaine en cours)

  function last7Dates() {
    var out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(); d.setDate(d.getDate() - i);
      out.push(d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()));
    }
    return out;
  }
  // Calcul de la semaine affichée, à partir de tout ce qui a été noté jour après jour.
  //  · alimentation : 1 repas « 20 % » max par jour = 100 % ce jour-là
  //  · sommeil : 7 h minimum par nuit  · hydratation : 8 verres  · cohérence : 3 fois  · vacuum : 10 répétitions
  //  · sport : 3 séances dans la semaine  · suivi du plan : moyenne de ces 6 habitudes
  // Un jour sans aucune donnée compte comme 0 (rien n'a été fait). La journée en cours n'est pas comptée.
  function bilanWeekStats() {
    var dailyAll = getJourDailyAll();
    var dates = currentWeekDatesElapsed();
    var n = dates.length;
    var week = getJourWeekly(bilanSelectedWeekKey());
    var alim = alimStatsForDates(dates);
    var cohSum = 0, waterSum = 0, sleepSum = 0, vacSum = 0, moods = [];
    var cohTotal = 0, waterFull = 0, sleepLogged = 0, sleepOk = 0, sleepHoursTotal = 0, vacDays = 0;
    dates.forEach(function(d) {
      var day = dailyAll[d];
      var cohDone = day ? (day.coherence || []).filter(Boolean).length : 0;
      cohSum += cohDone / 3; cohTotal += cohDone;
      var glasses = day ? (day.waterGlasses != null ? day.waterGlasses : (day.hydration ? WATER_TARGET_GLASSES : 0)) : 0;
      var wr = Math.min(glasses / WATER_TARGET_GLASSES, 1);
      waterSum += wr; if (wr >= 1) waterFull++;
      var sh = (day && day.sleepHours != null) ? day.sleepHours : null;
      if (sh != null) { sleepLogged++; sleepHoursTotal += sh; if (sh >= SLEEP_TARGET_HOURS) sleepOk++; sleepSum += Math.min(sh / SLEEP_TARGET_HOURS, 1); }
      var vac = day ? (day.vacuum || 0) : 0;
      vacSum += Math.min(vac / VACUUM_DAILY_TARGET, 1); if (vac >= VACUUM_DAILY_TARGET) vacDays++;
      if (day && day.mood != null) moods.push(day.mood);
    });
    function avg(x) { return n ? x / n : 0; }
    function toScore(r) { return Math.max(1, Math.min(10, Math.round(1 + r * 9))); }
    function pl(k, one, many) { return k + ' ' + (k > 1 ? many : one); }
    var sportCount = (week.sport || []).filter(Boolean).length;
    var ratios = {
      alimentation: alim.ratio, sport: Math.min(sportCount / SPORT_TARGET, 1), cardio: avg(cohSum),
      sommeil: avg(sleepSum), hydratation: avg(waterSum), vacuum: avg(vacSum)
    };
    ratios.suivi_plan = (ratios.alimentation + ratios.sport + ratios.cardio + ratios.sommeil + ratios.hydratation + ratios.vacuum) / 6;
    var scores = {
      alimentation: toScore(ratios.alimentation),
      sport: [2, 4, 7, 10][Math.min(sportCount, 3)],
      cardio: toScore(ratios.cardio),
      sommeil: toScore(ratios.sommeil),
      hydratation: toScore(ratios.hydratation),
      vacuum: toScore(ratios.vacuum),
      suivi_plan: toScore(ratios.suivi_plan),
      motivation: 5,
      moral: moods.length ? Math.round(moods.reduce(function(a, b) { return a + b; }, 0) / moods.length) : 5
    };
    var details = {};
    if (!n) {
      BILAN_AUTO_PILLARS.forEach(function(id) { details[id] = 'Pas encore de journée terminée à évaluer.'; });
    } else {
      details.alimentation = pl(alim.inPlan, 'jour', 'jours') + ' sur ' + n + ' dans le plan (1 repas « 20 % » max par jour).';
      details.sport = pl(sportCount, 'séance', 'séances') + ' sur ' + SPORT_TARGET + ' cette semaine.';
      details.cardio = 'Cohérence faite ' + cohTotal + ' fois sur ' + (n * 3) + ' possibles.';
      details.sommeil = sleepLogged
        ? pl(sleepOk, 'nuit', 'nuits') + ' sur ' + n + ' à ' + SLEEP_TARGET_HOURS + ' h ou plus (moyenne ' + (Math.round(sleepHoursTotal / sleepLogged * 10) / 10) + ' h sur les nuits notées).'
        : 'Aucune nuit notée : renseigne tes heures de sommeil dans l\'onglet ☀️ Aujourd\'hui.';
      details.hydratation = pl(waterFull, 'jour', 'jours') + ' sur ' + n + ' avec les ' + WATER_TARGET_GLASSES + ' verres.';
      details.vacuum = pl(vacDays, 'jour', 'jours') + ' sur ' + n + ' avec les ' + VACUUM_DAILY_TARGET + ' répétitions.';
      details.suivi_plan = 'Moyenne de tes 6 habitudes (repas, sport, cohérence, sommeil, hydratation, vacuum) : ' + Math.round(ratios.suivi_plan * 100) + ' %.';
      details.moral = moods.length ? 'Moyenne de ton moral noté chaque jour.' : 'Aucun moral noté : valeur neutre.';
    }
    return { n: n, scores: scores, details: details, ratios: ratios };
  }
  function autoSuggestScores() { return bilanWeekStats().scores; }
  function autoSuggestDevperso() {
    var vision = getVision();
    var ic = getInnerChild();
    var parts = [];
    var doneActions = vision.actions.filter(function(a){ return a.done; }).slice(-2);
    if (doneActions.length) parts.push('Vision : ' + doneActions.map(function(a){ return a.text; }).join(', '));
    var lastJournal = ic.dailyLog.filter(function(x){ return x.type === 'journal'; })[0];
    if (lastJournal && lastJournal.accomplishment) parts.push('Reparentage : ' + lastJournal.accomplishment);
    return parts.join(' — ');
  }
  function autoSuggestMantra() {
    return getCurrentMantra() || '';
  }
  function autoSuggestCycle() {
    var info = computeCycleInfo();
    if (!info) return { cycle: '', cycleJ: '' };
    var c = getCycle();
    var cycle = 'non';
    if (info.phaseId === 'menstruelle') cycle = 'oui';
    else if (info.phaseId === 'luteale' && (c.cycleLength - info.cycleDay) <= 4) cycle = 'pms';
    return { cycle: cycle, cycleJ: String(info.cycleDay) };
  }

  // Brouillon rangé PAR SEMAINE : chaque semaine a le sien, la semaine en cours démarre donc toujours
  // vierge et le bilan de la semaine d'avant reste disponible à part, sans rien mélanger.
  function bilanGetDraftStore() {
    var raw = getJSON(BILAN_DRAFT_KEY, null);
    if (raw && raw.v === 2 && raw.byWeek) return raw;
    var store = { v: 2, byWeek: {} };
    if (raw && typeof raw === 'object' && raw.scores) {
      // Ancien brouillon unique (d'avant ce correctif) : il date d'une semaine déjà passée, on le
      // range donc avec « la semaine d'avant » — rien n'est perdu et la semaine en cours repart vierge.
      delete raw.weekOffset;
      store.byWeek[weekKeyShift(bilanReferenceWeekKey(), -1)] = raw;
    }
    return store;
  }
  function bilanSaveDraft() {
    if (!BILAN_DRAFT || !BILAN_DRAFT_WEEK) return;
    var store = bilanGetDraftStore();
    store.byWeek[BILAN_DRAFT_WEEK] = BILAN_DRAFT;
    var keepFrom = weekKeyShift(bilanReferenceWeekKey(), -2);
    Object.keys(store.byWeek).forEach(function(k) { if (k < keepFrom) delete store.byWeek[k]; });
    setJSON(BILAN_DRAFT_KEY, store);
  }
  // Recalcule les curseurs automatiques, sauf ceux que la cliente a réglés elle-même à la main.
  function bilanRefreshAutoScores() {
    if (!BILAN_DRAFT) return;
    if (!BILAN_DRAFT.manual) BILAN_DRAFT.manual = {};
    var auto = bilanWeekStats().scores;
    BILAN_AUTO_PILLARS.forEach(function(id) {
      if (!BILAN_DRAFT.manual[id]) BILAN_DRAFT.scores[id] = auto[id];
    });
    if (BILAN_DRAFT.scores.motivation == null) BILAN_DRAFT.scores.motivation = 5;
    bilanSaveDraft();
  }
  function bilanInitDraft() {
    var wk = bilanSelectedWeekKey();
    if (BILAN_DRAFT && BILAN_DRAFT_WEEK === wk) return;
    var store = bilanGetDraftStore();
    BILAN_DRAFT_WEEK = wk;
    var saved = store.byWeek[wk];
    if (saved) { BILAN_DRAFT = saved; return; } // reprend le brouillon de CETTE semaine-là, là où la cliente l'avait laissé
    var auto = autoSuggestScores();
    var cyc = autoSuggestCycle();
    BILAN_DRAFT = {
      scores: auto, manual: {},
      comments: { alimentation: (getAlimentation().comments[wk] || ''), sport: '', cardio: '', sommeil: '', hydratation: '', vacuum: '', suivi_plan: '', motivation: '', moral: '' },
      mantra: autoSuggestMantra(),
      priosem1: '', priosem2: '', priosem3: '',
      blocage: '', devperso: autoSuggestDevperso(), smiles: '', pasmoyen: '',
      cycle: cyc.cycle, cycleJ: cyc.cycleJ
    };
    bilanSaveDraft();
  }
  function bilanSetScore(pillarId, val) {

    bilanSaveDraft();

  // ===== DISCIPLINE (calculée à partir des scores motivation + suivi du plan) =====
  function bilanComputeDiscipline() {
    var mot = (BILAN_DRAFT && BILAN_DRAFT.scores.motivation != null) ? parseInt(BILAN_DRAFT.scores.motivation, 10) : 5;
    var sp = (BILAN_DRAFT && BILAN_DRAFT.scores.suivi_plan != null) ? parseInt(BILAN_DRAFT.scores.suivi_plan, 10) : 5;
    var disc = Math.min(10, Math.round((sp + Math.max(0, sp - mot) / 2) * 10) / 10);
    var msg;
    if (mot <= 4 && sp >= 7) msg = '🏆 La discipline prend le relais ! Tu avances sans motivation — c\'est ta vraie force.';
    else if (mot <= 4 && sp >= 5) msg = '💜 Tu continues malgré le manque d\'envie. C\'est exactement comme ça que la discipline se construit.';
    else if (mot <= 6 && sp > mot) msg = '💪 Ton suivi dépasse ta motivation — c\'est ça la discipline ! Tu n\'attends pas l\'envie pour agir.';
    else if (mot >= 8 && sp >= 8) msg = '🔥 Motivation ET discipline au maximum ! Continue sur cette lancée.';
    else if (mot >= 7 && sp >= 6) msg = '✨ Belle semaine ! Quand la motivation sera plus basse, ton suivi du plan fera la différence.';
    else msg = '🎯 Chaque action compte, quelle que soit l\'envie. La régularité construit la discipline.';
    return { disc: disc, msg: msg, mot: mot, sp: sp };
  }
  function bilanRenderDiscipline() {
    var d = bilanComputeDiscipline();
    var scoreEl = document.getElementById('bilan-disc-score');
    var barEl = document.getElementById('bilan-disc-bar');
    var msgEl = document.getElementById('bilan-disc-msg');
    if (scoreEl) scoreEl.textContent = (d.disc % 1 === 0 ? d.disc : d.disc.toFixed(1)) + '/10';
    if (barEl) barEl.style.width = (d.disc / 10 * 100) + '%';
    if (msgEl) msgEl.textContent = d.msg;
  }

  function cleanEmpty(obj) {
    var out = {};
    Object.keys(obj).forEach(function(k) {
      var val = obj[k];
      if (val == null || val === '' || val === 0) return;
      if (typeof val === 'object' && !Array.isArray(val)) {
        var inner = cleanEmpty(val);
        if (Object.keys(inner).length) out[k] = inner;
      } else out[k] = val;
    });
    return out;
  }

  function bilanWeekVacuumSummary() {
    var dailyAll = getJourDailyAll();
    var dates = currentWeekDatesElapsed();
    var totalSeries = 0, joursActifs = 0;
    dates.forEach(function(d) {
      var day = dailyAll[d];
      var v = day ? (day.vacuum || 0) : 0;
      if (v > 0) { totalSeries += v; joursActifs++; }
    });
    if (!totalSeries) return null;
    return { series: totalSeries, jours: joursActifs };
  }

  function bilanBuildPayload() {
    bilanInitDraft();
    bilanSyncFromDom();
    var identity = getIdentity();
    var alim = getAlimentation();
    var weekMeals = {};
    weekDatesForKey(bilanSelectedWeekKey()).forEach(function(dt) {
      var j = alimDayIdForISODate(dt);
      var dayMeals = alim.meals[dt] || {};
      weekMeals[j] = {};
      Object.keys(dayMeals).forEach(function(m) {
        var cell = dayMeals[m];
        if (cell && (cell.t || cell.ty)) weekMeals[j][m] = { t: (cell.t||'').slice(0,80), ty: cell.ty||'' };
      });
    });
    var disc = bilanComputeDiscipline();
    var scores = Object.assign({}, BILAN_DRAFT.scores);
    scores.discipline = disc.disc;
    var mensAll = getMensurations();
    var data = {
      nom: (identity.prenom + ' ' + identity.nom).trim(),
      email: identity.email,
      date: formatDDMMYYYY(todayISO()),
      semaineDu: formatDDMMYYYY(weekDatesForKey(bilanSelectedWeekKey())[0]),
      semaineAu: formatDDMMYYYY(weekDatesForKey(bilanSelectedWeekKey())[6]),
      cycle: BILAN_DRAFT.cycle, cycleJ: BILAN_DRAFT.cycleJ,
      mantra: BILAN_DRAFT.mantra,
      priosem1: BILAN_DRAFT.priosem1, priosem2: BILAN_DRAFT.priosem2, priosem3: BILAN_DRAFT.priosem3,
      blocage: BILAN_DRAFT.blocage, devperso: BILAN_DRAFT.devperso, smiles: BILAN_DRAFT.smiles, pasmoyen: BILAN_DRAFT.pasmoyen || (function() { var st = bilanWeekStepsSummary(); return st ? String(st.moyenne) : ''; })(),
      pas: bilanWeekStepsSummary(),
      scores: scores,
      comments: Object.assign({}, BILAN_DRAFT.comments),
      weekMeals: weekMeals,
      vacuum: bilanWeekVacuumSummary(),
      mensurations: mensAll.length ? mensAll[0] : null
    };
    // Sections personnelles à part : jamais incluses, sauf si la cliente a explicitement
    // activé le partage de cette section (voir sharePrefsToggleHtml / getSharePrefs).
    var prefs = getSharePrefs();
    if (prefs.vision) {
      var vItems = getShareItems('vision'), vAll = getVision(), vOut = {};
      if (vItems.valeurs) vOut.values = vAll.values;
      if (vItems.anime) vOut.interests = vAll.interests;
      if (vItems.forces) vOut.strengths = vAll.strengths;
      if (vItems.roue) vOut.wheel = vAll.wheel;
      if (vItems.declaration) vOut.statement = vAll.statement;
      if (vItems.situation) vOut.embodiment = vAll.embodiment;
      if (vItems.actions) vOut.actions = vAll.actions;
      if (vItems.futur) vOut.futur = getFutur();
      if (vItems.vboard) vOut.vboard = getVBoard();
      data.vision = vOut;
    }
    if (prefs.enfant) {
      var eItems = getShareItems('enfant'), eAll = getInnerChild(), eOut = {};
      if (eItems.besoins) eOut.needs = eAll.needs;
      if (eItems.blessures) eOut.woundAnswers = eAll.woundAnswers;
      if (eItems.lettres) eOut.letters = eAll.letters;
      if (eItems.croyances) eOut.beliefs = eAll.beliefs;
      data.enfant = eOut;
    }
    if (prefs.objectifs) data.objectifs = getObjectifsList();
    if (prefs.reves) data.reves = getGrandsReves();
    if (prefs.ecriture) {
      var ecItems = getShareItems('ecriture');
      // Au compte-goutte : seuls les textes cochés individuellement partent, jamais la liste entière
      // d'un bloc — voir getSharedEcritIds.
      var sharedEcritIds = getSharedEcritIds();
      var sharedEcrits = getEcriture().filter(function(w) { return !!sharedEcritIds[w.id]; });
      if (sharedEcrits.length) data.ecriture = sharedEcrits;
      if (ecItems.revesnuit) data.nightDreams = getNightDreams();
    }
    return cleanEmpty(data);
  }

  // déjà envoyé son bilan (il apparaît dans son historique ci-dessous) mais que la coach ne l'a
  // jamais reçu (mail non arrivé, code coupé/perdu…). Réutilise le payload complet sauvegardé au
  // moment de l'envoi initial et l'écrit à nouveau sur le même chemin Firebase direct que
  // bilanValiderEtEnvoyer, avec un nouvel id : la coach le voit comme un nouveau bilan reçu, sans
  // que la cliente ait à tout ressaisir. ──
  function bilanResendFromHistory(idx) {
    var all = getBilanHistory();
    var entry = all[idx];
    var statusEl = document.getElementById('bilanResendStatus' + idx);
    var btn = document.getElementById('bilanResendBtn' + idx);
    if (!entry || !entry.payload) return;
    if (!fbDB || !CLIENT_CODE) {
      if (statusEl) { statusEl.style.display = 'block'; statusEl.style.color = '#B96A46'; statusEl.textContent = "❌ Ton espace n'est pas encore relié à ta coach — impossible de renvoyer automatiquement."; }
      return;
    }
    var identity = getIdentity();
    var payload = Object.assign({}, entry.payload, {
      nom: entry.payload.nom || ((identity.prenom + ' ' + identity.nom).trim()),
      email: entry.payload.email || identity.email
    });
    var id = uid('bilan');
    var toSend = Object.assign({}, payload, { status: 'nouveau', createdAt: new Date().toISOString(), renvoye: true });
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Envoi…'; }
    fbDB.ref(bilansRecusBasePath() + '/' + CLIENT_CODE + '/' + id).set(toSend).then(function() {
      if (btn) { btn.disabled = false; btn.textContent = '✅ Renvoyé !'; }
      if (statusEl) { statusEl.style.display = 'block'; statusEl.style.color = '#2C4432'; statusEl.textContent = '✅ Renvoyé — il arrive automatiquement dans le tableau de bord de ta coach.'; }
      setTimeout(function() { if (btn) btn.textContent = '🔄 Renvoyer à ma coach'; }, 4000);
    }).catch(function(err) {
      if (btn) { btn.disabled = false; btn.textContent = '🔄 Renvoyer à ma coach'; }
      if (statusEl) { statusEl.style.display = 'block'; statusEl.style.color = '#c53030'; statusEl.textContent = '❌ Erreur : ' + (err && err.message ? err.message : "impossible d'envoyer."); }
    });
  }

  function bilanGenerate() {
    var identity = getIdentity();
    var errEl = document.getElementById('bilan-identity-error');
    if (!identity.prenom || !identity.email || identity.email.indexOf('@') < 0) {
      if (errEl) errEl.style.display = 'block';
      return;
    }
    if (errEl) errEl.style.display = 'none';
    var clean = bilanBuildPayload();
    var jsonStr = JSON.stringify(clean);
    var code;
    if (typeof LZString !== 'undefined') code = 'EPANOUISSEMENT:' + LZString.compressToBase64(jsonStr);
    else code = 'EPANOUISSEMENTB64:' + btoa(unescape(encodeURIComponent(jsonStr)));

    var text = '🌿 Bilan co-NAÎTRE — ' + clean.date + (clean.semaineDu ? ' (semaine du ' + clean.semaineDu + ' au ' + clean.semaineAu + ')' : '') + '\n';
    text += '👤 ' + clean.nom + (clean.email ? ' (' + clean.email + ')' : '') + '\n\n';
    if (clean.scores) {
      text += '📊 Scores :\n';
      Object.keys(clean.scores).forEach(function(k) { text += '· ' + k + ' : ' + clean.scores[k] + '/10\n'; });
      text += '\n';
    }
    if (clean.mantra) text += '✨ Mantra : ' + clean.mantra + '\n';
    if (clean.priosem1 || clean.priosem2 || clean.priosem3) {
      text += '📅 Priorités de la semaine : ' + [clean.priosem1, clean.priosem2, clean.priosem3].filter(Boolean).join(' · ') + '\n';
    }
    if (clean.blocage) text += '🚧 Blocages : ' + clean.blocage + '\n';
    if (clean.devperso) text += '🌱 Développement perso : ' + clean.devperso + '\n';
    if (clean.smiles) text += '😊 Smiles : ' + clean.smiles + '\n';
    if (clean.vacuum && clean.vacuum.series) {
      text += '🌬️ Vacuum abdominal : ' + clean.vacuum.series + ' répétition' + (clean.vacuum.series > 1 ? 's' : '') + ' sur ' + (clean.vacuum.jours || 0) + ' jour' + (clean.vacuum.jours > 1 ? 's' : '') + ' cette semaine\n';
    }
    if (clean.pas && clean.pas.moyenne) {
      text += '👟 Pas : ' + stepsFmt(clean.pas.moyenne) + ' pas / jour en moyenne (' + clean.pas.jours + ' jour' + (clean.pas.jours > 1 ? 's' : '') + ' notés), objectif ' + stepsFmt(clean.pas.objectif) + ' atteint ' + clean.pas.joursObjectif + ' fois\n';
    }
    if (clean.mensurations) {
      text += '📏 Mensurations (' + clean.mensurations.date + ') :\n';
      MENS_FIELDS.forEach(function(f) {
        if (clean.mensurations[f.id] != null) text += '· ' + f.label + ' : ' + clean.mensurations[f.id] + f.unit + '\n';
      });
    }
    // Sections partagées volontairement (voir bilanBuildPayload / getSharePrefs) — résumé lisible pour le WhatsApp.
    if (clean.vision) {
      text += '\n🔭 Vision (partagée) :\n';
      if (clean.vision.statement) text += '· Ma vision : ' + clean.vision.statement + '\n';
      if (clean.vision.values && clean.vision.values.length) text += '· Valeurs : ' + clean.vision.values.join(', ') + '\n';
      if (clean.vision.futur) text += '· Ton futur : partagé\n';
      if (clean.vision.vboard && clean.vision.vboard.objectif) text += '· Objectif de mon vision board : ' + clean.vision.vboard.objectif + '\n';
    }
    if (clean.enfant) {
      text += '\n🧒 Enfant intérieur (partagé) :\n';
      if (clean.enfant.letters && clean.enfant.letters.length) text += '· ' + clean.enfant.letters.length + ' lettre(s) écrite(s)\n';
      if (clean.enfant.beliefs && clean.enfant.beliefs.length) text += '· ' + clean.enfant.beliefs.length + ' croyance(s) notée(s)\n';
    }
    if (clean.objectifs && clean.objectifs.length) {
      text += '\n🎯 Objectifs (partagés) :\n';
      clean.objectifs.forEach(function(g) { if (g.final) text += '· ' + g.final + '\n'; });
    }
    if (clean.reves && clean.reves.length) {
      text += '\n🌙 Grands rêves de vie (partagés) :\n';
      clean.reves.forEach(function(r) { if (r.text) text += '· ' + r.text + '\n'; });
    }
    if (clean.ecriture && clean.ecriture.length) {
      text += '\n✍️ Écriture libre (partagée) : ' + clean.ecriture.length + ' texte(s)\n';
    }
    if (clean.nightDreams && clean.nightDreams.length) {
      text += '🌙 Rêves de la nuit (partagés) : ' + clean.nightDreams.length + ' rêve(s) noté(s)\n';
    }
    text += '\n📥 Code bilan :\n' + code;

    document.getElementById('bilanCodeBox').value = code;
    document.getElementById('bilanTextBox').value = text;
    document.getElementById('bilanOutput').style.display = 'block';

    saveBilanHistoryEntry({ date: clean.date, semaineDu: clean.semaineDu || '', savedAt: new Date().toISOString(), text: text, scores: clean.scores || {}, payload: clean });
    renderBilanHistoryList();
  }
  function bilanClearDraft() {
    var wk = BILAN_DRAFT_WEEK;
    BILAN_DRAFT = null; BILAN_DRAFT_WEEK = null;

    var store = bilanGetDraftStore();
    delete store.byWeek[wk];
    setJSON(BILAN_DRAFT_KEY, store);
  }

  // ── Envoi direct du bilan vers le tableau de bord de la coach (au même titre que le RDV urgent,
  // voir urgentBasePath) — chemin global epanouissement/_bilans_recus/<code client>/<id>. La coach
  // n'a plus besoin de coller un code : son tableau de bord importe automatiquement dès réception
  // (voir dashBilansRecusListen côté tableau_superfitmum.html), et le bilan apparaît alors dans sa
  // fiche cliente + dans l'onglet "Bilans du jour", exactement comme un import manuel. ──
  function bilansRecusBasePath() { return 'epanouissement/_bilans_recus'; }
  function bilanValiderEtEnvoyer() {
    var btn = document.getElementById('bilanDirectBtn');
    var s = document.getElementById('bilanDirectStatus');
    if (!fbDB || !CLIENT_CODE) {
      if (s) { s.style.color = '#B96A46'; s.textContent = '❌ Ton espace n\'est pas encore relié à ta coach — utilise les options ci-dessous en attendant.'; }
      return;
    }
    var identity = getIdentity();
    if (!identity.prenom || !identity.email || identity.email.indexOf('@') < 0) {
      var errEl = document.getElementById('bilan-identity-error');
      if (errEl) errEl.style.display = 'block';
      if (s) { s.style.color = '#B96A46'; s.textContent = '❌ Complète ton prénom et ton e-mail (en haut) avant d\'envoyer.'; }
      return;
    }
    var clean = bilanBuildPayload();
    var id = uid('bilan');
    var payload = Object.assign({}, clean, { status: 'nouveau', createdAt: new Date().toISOString() });
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Envoi…'; }
    fbDB.ref(bilansRecusBasePath() + '/' + CLIENT_CODE + '/' + id).set(payload).then(function() {
      if (btn) { btn.disabled = false; btn.textContent = '✅ Valider et envoyer directement à ma coach'; }
      if (s) { s.style.color = '#2C4432'; s.textContent = '✅ Envoyé ! Il arrive automatiquement dans le tableau de bord de ta coach.'; }
      saveBilanHistoryEntry({ date: clean.date, semaineDu: clean.semaineDu || '', savedAt: new Date().toISOString(), text: (document.getElementById('bilanTextBox') || {}).value || '', scores: clean.scores || {}, payload: clean });
      renderBilanHistoryList();
      bilanClearDraft();
    }).catch(function(err) {
      if (btn) { btn.disabled = false; btn.textContent = '✅ Valider et envoyer directement à ma coach'; }
      if (s) { s.style.color = '#c53030'; s.textContent = '❌ Erreur : ' + (err && err.message ? err.message : 'impossible d\'envoyer.'); }
    });
  }

  function bilanSetWeekOffset(off) {

    out += '<div id="bilanMensChartsWrap" style="margin-top:16px;"></div>';
    out += '</div></div>';

    out += '<div class="card"><h3><span class="h3-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.2"/></svg></span> Photos de progression</h3><p class="card-sub">Ajoute 4 photos (face, dos, profil gauche, profil droit) depuis ta pellicule ou en les prenant sur le moment, et envoie-les directement à ta coach — elles ne sont jamais enregistrées dans l\'application.</p>';
    out += '<div class="prog-photo-grid">';
    [['face', '🤳', 'Face'], ['dos', '🔄', 'Dos'], ['gauche', '👈', 'Profil gauche'], ['droit', '👉', 'Profil droit']].forEach(function(s) {
      var key = s[0], icon = s[1], label = s[2];
      var inputId = 'bilan-prog-' + key, imgId = 'bilan-prev-' + key;
      out += '<div class="prog-photo-slot" onclick="progTrigger(' + jsAttr(inputId) + ')">';
      out += '<input type="file" id="' + inputId + '" accept="image/*" style="display:none" onchange="progLoadPhoto(event,' + jsAttr(inputId) + ',' + jsAttr(imgId) + ',' + jsAttr(key) + ')">';
      out += '<div class="prog-photo-preview"><img id="' + imgId + '" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:12px">';
      out += '<div id="bilan-ph-' + key + '" class="prog-photo-placeholder"><span style="font-size:22px;">' + icon + '</span><span style="font-size:11px;font-weight:600;color:var(--muted);">' + label + '</span></div></div>';
      out += '<button type="button" class="prog-del-btn" id="bilan-del-' + key + '" onclick="event.stopPropagation();progClearPhoto(' + jsAttr(inputId) + ',' + jsAttr(imgId) + ',' + jsAttr(key) + ')" style="display:none;">✕</button>';
      out += '</div>';
    });
    out += '</div>';
    out += '<button type="button" class="btn full" id="progPhotoShareBtn" onclick="progSharePhotos()" style="display:none;margin-top:10px;">📤 Envoyer mes photos de progression à ma coach</button>';
    out += '</div>';

    out += '<div class="card"><h3><span class="h3-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/></svg></span> Le reste, en quelques mots</h3>';
    out += '<span class="field-label">Mantra du jour</span><input type="text" id="bilan-field-mantra" value="' + esc(BILAN_DRAFT.mantra) + '" oninput="bilanSyncFromDom()">';
    out += '<span class="field-label">Priorité 1 de la semaine</span><input type="text" id="bilan-field-priosem1" value="' + esc(BILAN_DRAFT.priosem1) + '" oninput="bilanSyncFromDom()">';
    out += '<span class="field-label">Priorité 2</span><input type="text" id="bilan-field-priosem2" value="' + esc(BILAN_DRAFT.priosem2) + '" oninput="bilanSyncFromDom()">';
    out += '<span class="field-label">Priorité 3</span><input type="text" id="bilan-field-priosem3" value="' + esc(BILAN_DRAFT.priosem3) + '" oninput="bilanSyncFromDom()">';
    out += '<span class="field-label">Points de blocage</span><textarea id="bilan-field-blocage" rows="2" oninput="bilanSyncFromDom()">' + esc(BILAN_DRAFT.blocage) + '</textarea>';
    out += '<span class="field-label">Développement personnel</span><textarea id="bilan-field-devperso" rows="2" oninput="bilanSyncFromDom()">' + esc(BILAN_DRAFT.devperso) + '</textarea>';
    out += '<p class="points-note" style="margin-top:-6px;">Pré-rempli à partir de tes onglets Vision et Enfant intérieur.</p>';
    out += '<span class="field-label">Les smiles de ma semaine</span><textarea id="bilan-field-smiles" rows="2" oninput="bilanSyncFromDom()">' + esc(BILAN_DRAFT.smiles) + '</textarea>';
    out += '<span class="field-label">Nombre de pas moyen / jour</span><input type="number" id="bilan-field-pasmoyen" value="' + esc(BILAN_DRAFT.pasmoyen || (bilanWeekStepsSummary() ? bilanWeekStepsSummary().moyenne : '')) + '" oninput="bilanSyncFromDom()">';
    (function() { var st = bilanWeekStepsSummary(); if (st) out += '<p class="points-note" style="margin-top:-6px;">Calculé à partir de tes pas notés dans « Aujourd\'hui » (' + st.jours + ' jour' + (st.jours > 1 ? 's' : '') + '). Tu peux le corriger.</p>'; })();
    out += '</div>';

    out += '<div class="card"><h3><span class="h3-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1Z"/></svg></span> À toi de choisir</h3><p class="card-sub">Coche ce que tu veux inclure dans ce bilan. Ça revient au même que d\'activer le partage directement dans chaque onglet.</p>';
    SHARE_SECTIONS_ORDER.forEach(function(section) { out += shareToggleRowHtml(section); });
    out += '</div>';
    out += '<div class="card" style="background:#E7EEE3;border-color:#C9DAC4;"><p style="margin:0;font-size:12.5px;color:#3E5A3B;line-height:1.5;">Le reste de ton espace intérieur ne bouge pas d\'ici, sauf si tu actives une case.</p></div>';

    out += '<div class="card"><h3><span class="h3-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-6 16-3-7-7-1Z"/></svg></span> Envoyer mon bilan</h3><p class="card-sub">Génère le bilan complet, à envoyer à ta coach — comme d\'habitude.</p>';
    out += '<button class="btn full" onclick="bilanGenerate()">✨ Générer mon bilan</button>';
    out += '<div id="bilanOutput" style="display:none;margin-top:14px;">';
    out += '<span class="field-label">Résumé</span><textarea id="bilanTextBox" rows="8" readonly></textarea>';
    out += '<textarea id="bilanCodeBox" style="display:none;"></textarea>';
    (function() {
      var canDirect = !!CLIENT_CODE;
      out += '<button type="button" class="btn full" id="bilanDirectBtn" onclick="bilanValiderEtEnvoyer()"' + (canDirect ? '' : ' disabled') + ' style="background:#2C4432;margin-top:2px;' + (canDirect ? '' : 'opacity:.55;cursor:not-allowed;') + '">✅ Valider et envoyer directement à ma coach</button>';
      out += '<p class="points-note" id="bilanDirectStatus" style="' + (canDirect ? '' : 'color:#B96A46;') + 'margin-top:4px;">' + (canDirect ? 'Il arrive automatiquement dans son tableau de bord, sans rien envoyer d\'autre.' : 'Espace non encore relié à ta coach — utilise les options ci-dessous en attendant.') + '</p>';
    })();
    out += '<p class="points-note" style="margin:10px 0 4px;">Ou, comme avant :</p>';
    out += '<div class="btn-row">';
    out += '<button class="btn" onclick="bilanSendEmail()">📧 Envoyer par e-mail</button>';
    out += '<button class="btn secondary" onclick="bilanShareCode()">📱 Envoyer par WhatsApp</button>';
    out += '<button class="btn ghost" onclick="bilanCopyText()">📋 Copier</button>';
    out += '</div><span class="points-note" id="bilanCopyStatus"></span>';
    out += '</div></div>';

    out += '<div class="card"><h3><span class="h3-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10M9 4v4.5L5 17a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-4-8.5V4"/></svg></span> Historique de mes bilans</h3><p class="card-sub">Retrouve tous les bilans que tu as déjà envoyés à ta coach.</p>';
    out += '<div id="bilanHistoryList"></div>';
    out += '</div>';

    el.innerHTML = out;
    bilanRenderMensHistory();
    renderBilanHistoryList();
  }

  window.addEventListener('load', function() {
    initAll();
    initSync();
  });
</script>
</body>
</html>
